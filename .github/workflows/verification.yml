
name: NuSMV Formal Verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      model:
        description: "Model to verify"
        required: true
        type: choice
        default: cybersecurity.smv
        options:
          - cybersecurity.smv
          - cybersecurity_error.smv

jobs:
  formal-verification:
    runs-on: windows-latest

    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download NuSMV 2.7.1
        run: |
          $url = "https://nusmv.fbk.eu/distrib/2.7.1/NuSMV-2.7.1-win64.zip"
          Invoke-WebRequest -Uri $url -OutFile nusmv.zip
          Expand-Archive -Path nusmv.zip -DestinationPath nusmv

      - name: Verify formal properties
        env:
          MODEL: ${{ inputs.model || 'cybersecurity.smv' }}
        run: |
          $ErrorActionPreference = "Stop"

          $nusmv = Get-ChildItem -Path nusmv -Filter NuSMV.exe -Recurse |
            Select-Object -First 1

          if (-not $nusmv) {
            throw "NuSMV.exe not found"
          }

          if (-not (Test-Path $env:MODEL)) {
            throw "Model file not found"
          }

          Write-Host "Checking model: $env:MODEL"

          $output = & $nusmv.FullName $env:MODEL 2>&1 | Out-String
          Write-Host $output

          if ($LASTEXITCODE -ne 0) {
            throw "NuSMV execution failed"
          }

          if ($output -match "is false") {
            throw "VERIFICATION FAILED"
          }

          $count = ([regex]::Matches($output, "is true")).Count

          if ($count -ne 3) {
            throw "VERIFICATION ERROR: Expected 3 properties"
          }

          Write-Host "VERIFICATION PASSED"
